stages:
  - test
  - scan

# ----------------------
# 1. TESTS PHP & COVERAGE
# ----------------------
php-tests:
  stage: test
  image: php:8.3-cli
  before_script:
    - apt-get update && apt-get install -y unzip git curl libxml2-dev
    # Installation de Composer et Xdebug en une fois
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - pecl install xdebug && docker-php-ext-enable xdebug
  script:
    - cd siteSAE2A
    # On installe les dépendances ici directement
    - composer install --no-interaction --prefer-dist
    # Exécution de PHPUnit
    - php -d xdebug.mode=coverage vendor/bin/phpunit \
        --coverage-text \
        --coverage-clover=../clover.xml \
        --coverage-cobertura=../coverage.xml \
        --log-junit=../junit.xml
  coverage: '/^\s*Lines:\s*\d+(?:\.\d+)?\%/'
  artifacts:
    when: always
    paths:
      - clover.xml
      - coverage.xml
      - junit.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 hour

# ----------------------
# 2. SONAR SCANNER
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  dependencies:
    - php-tests
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    # On vérifie la présence des rapports
    - ls -l clover.xml junit.xml
    - sonar-scanner \
        -Dsonar.sources=siteSAE2A \
        -Dsonar.tests=siteSAE2A/tests \
        -Dsonar.php.coverage.reportPaths=clover.xml \
        -Dsonar.php.tests.reportPath=junit.xml \
        -Dsonar.exclusions=siteSAE2A/vendor/** \
        -X
  allow_failure: true
  only:
    - main