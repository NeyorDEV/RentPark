# ----------------------
# STAGES
# ----------------------
stages:
  - build
  - scan
  - 📦push
  - 🚀deploy
  - 🌐expose-service

# ----------------------
# BUILD BLAZOR (Le C# reste séparé car il est léger)
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd Blazor/BlazorAdminRentPark
    - dotnet restore
    - dotnet build -c Release
  artifacts:
    paths:
      - Blazor/BlazorAdminRentPark/bin/Release/
    expire_in: 1 hour
sonarqube-check:
  stage: scan
  image: php:8.3-cli
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  before_script:
    # Installation silencieuse des outils
    - apt-get update && apt-get install -y unzip git curl libxml2-dev
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - pecl install pcov && docker-php-ext-enable pcov
    
    # Téléchargement et extraction silencieuse (-q) du scanner
    - curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
    - unzip -q /tmp/sonar-scanner.zip -d /opt
    - export PATH="/opt/sonar-scanner-6.2.1.4610-linux-x64/bin:$PATH"

  script:
    - cd siteSAE2A
    
    # Nettoyage et installation des dépendances
    - rm -rf vendor/ composer.lock
    - composer install --no-interaction --prefer-dist
    - composer dump-autoload
    
    # Exécution des tests avec PCOV
    # On force le dossier 'tests' pour éviter les erreurs de répertoires manquants
    - php -d pcov.enabled=1 vendor/phpunit/phpunit/phpunit --coverage-clover=../clover.xml --log-junit=../junit.xml --do-not-cache-result tests || echo "Certains tests ont échoué, envoi des résultats partiels..."
    
    - cd ..
    
    # Lancement du scan Sonar
    # On utilise ton fichier sonar-project.properties pour la clé 'RentPark'
    - |
      sonar-scanner \
        -Dsonar.sources=siteSAE2A \
        -Dsonar.php.coverage.reportPaths=clover.xml \
        -Dsonar.php.tests.reportPath=junit.xml \
        -Dsonar.exclusions="siteSAE2A/vendor/**,siteSAE2A/tests/**" \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.login="${SONAR_TOKEN}"

  allow_failure: true
  only:
    - main

sonarqube-kotlin:
  stage: scan
  image: eclipse-temurin:11-jdk
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    ANDROID_HOME: "/opt/android-sdk"
  before_script:
    - apt-get update && apt-get install -y wget unzip curl
    - mkdir -p ${ANDROID_HOME}/cmdline-tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
    - unzip -q /tmp/cmdtools.zip -d ${ANDROID_HOME}/cmdline-tools
    - mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
    - export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1
    - curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
    - unzip -q /tmp/sonar-scanner.zip -d /opt
    - export PATH="/opt/sonar-scanner-6.2.1.4610-linux-x64/bin:${PATH}"
  script:
    - cd RentParkKotlin
    - chmod +x ./gradlew
    - ./gradlew testDebugUnitTest --no-daemon
    - cd ..
    - |
      sonar-scanner \
        -Dsonar.projectKey=RentParkKotlin \
        -Dsonar.projectName="RentPark Kotlin Android" \
        -Dsonar.sources=RentParkKotlin/app/src/main \
        -Dsonar.tests=RentParkKotlin/app/src/test \
        -Dsonar.coverage.jacoco.xmlReportPaths=RentParkKotlin/app/build/reports/coverage/test/debug/report.xml \
        -Dsonar.exclusions="**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,**/ComposableSingletons*" \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.login="${SONAR_TOKEN}"
  allow_failure: true
  only:
    - main
# ----------------------
# INCLUDE & DOCKER JOBS (Inchangés)
# ----------------------
include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file: ['build/.docker-build.yml', 'deploy/.docker-deploy.yml']
    token: $CI_PERSONAL_TOKEN

push-dotnet-image:
  extends: .build-and-push-docker-image
  stage: 📦push
  variables:
    DOCKERFILE_RELATIVE_PATH: Blazor/BlazorAdminRentPark/Dockerfile
    DOCKERFILE_CONTEXT_PATH: Blazor/BlazorAdminRentPark
    DESTINATION_REGISTRY_IMAGE_NAME: codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark
    DESTINATION_REGISTRY_IMAGE_VERSION: latest
  dependencies:
    - build-blazor
  rules:
    - when: on_success

deploy-my-pod:
  extends: .deploy-image
  stage: 🚀deploy
  variables:
    CONTAINER_NAME: blazor-admin-pod
    CONTAINER_IMAGE_PATH: codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark:latest
    NAMESPACE_NAME: altixier1
  dependencies:
    - push-dotnet-image
  rules:
    - when: manual