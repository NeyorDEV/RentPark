# ----------------------
# STAGES
# ----------------------
stages:
  - build
  - scan
  - 📦push
  - 🚀deploy

# ----------------------
# BUILD PHP
# ----------------------
build-php:
  stage: build
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y unzip git curl
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
  script:
    - echo "Installing PHP dependencies..."
    - cd siteSAE2A
    - composer install --no-interaction --prefer-dist
    - composer dump-autoload
    - echo "PHP build done"
  artifacts:
    paths:
      - siteSAE2A/vendor/

# ----------------------
# BUILD BLAZOR
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd Blazor/BlazorAdminRentPark
    - echo "Restoring .NET packages..."
    - dotnet restore
    - echo "Building Blazor app..."
    - dotnet build -c Release
  artifacts:
    paths:
      - Blazor/BlazorAdminRentPark/bin/Release/

# ----------------------
# SONAR SCANNER
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  script:
    - echo "Running SonarScanner..."
    - sonar-scanner -X
  allow_failure: true
  dependencies:
    - build-php
    - build-blazor
  only:
    - main

# ----------------------
# INCLUDE JOB GÉNÉRIQUE BUILD/DOCKER
# ----------------------
include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file:
      - 'build/.docker-build.yml'

# ----------------------
# PUSH DOCKER IMAGE (BLAZOR)
# ----------------------
push-dotnet-image:
  extends: .build-and-push-docker-image
  stage: 📦push
  variables:
    DOCKERFILE_RELATIVE_PATH: Blazor/BlazorAdminRentPark/Dockerfile
    DOCKERFILE_CONTEXT_PATH: Blazor/BlazorAdminRentPark
    DESTINATION_REGISTRY_IMAGE_NAME: codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark
    DESTINATION_REGISTRY_IMAGE_VERSION: latest
    DESTINATION_REGISTRY_USER: $CI_REGISTRY_USER
    DESTINATION_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  dependencies:
    - build-blazor
  allow_failure: true
  rules:
    - when: on_success  # automatique

# ----------------------
# INCLUDE JOB GÉNÉRIQUE DEPLOY
# ----------------------
include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file:
      - 'deploy/.docker-deploy.yml'

# ----------------------
# DEPLOY
# ----------------------
deploy-my-pod:
  extends: .deploy-image
  stage: 🚀deploy
  variables:
    CONTAINER_NAME: blazor-admin-pod
    CONTAINER_ENV_VAR_VAR_1: "ENV_PRODUCTION=true"
    CONTAINER_IMAGE_PATH: codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark:latest
    NAMESPACE_TOKEN: $CI_JOB_TOKEN
    NAMESPACE_NAME: qumiotto
  dependencies:
    - push-dotnet-image
  allow_failure: true
  rules:
    - when: on_success  # automatique après le push Docker






