# ----------------------
# STAGES
# ----------------------
stages:
  - build
  - scan
  - 📦push
  - 🚀deploy
  - 🌐expose-service

# ----------------------
# BUILD BLAZOR (Le C# reste séparé car il est léger)
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd Blazor/BlazorAdminRentPark
    - dotnet restore
    - dotnet build -c Release
  artifacts:
    paths:
      - Blazor/BlazorAdminRentPark/bin/Release/
    expire_in: 1 hour


sonarqube-check:
  stage: scan
  image: php:8.3-cli
  dependencies:
    - build-blazor
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  before_script:
    - apt-get update && apt-get install -y unzip git curl libxml2-dev
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - pecl install pcov && docker-php-ext-enable pcov
    - curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
    - unzip /tmp/sonar-scanner.zip -d /opt
    - export PATH="/opt/sonar-scanner-6.2.1.4610-linux-x64/bin:$PATH"

  script:
    - cd siteSAE2A
    
    # 1. On force la réinstallation propre pour corriger la classe manquante
    - rm -rf vendor/ composer.lock
    - composer install --no-interaction --prefer-dist
    
    # 2. Exécution des tests avec un chemin direct vers phpunit
    # On ajoute --do-not-cache-result pour éviter les problèmes de droits en écriture
    - php -d pcov.enabled=1 vendor/phpunit/phpunit/phpunit --coverage-clover=../clover.xml --log-junit=../junit.xml --do-not-cache-result
    
    - cd ..
    
    # 3. Lancement du scan
    - sonar-scanner \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
        -Dsonar.sources=siteSAE2A,Blazor \
        -Dsonar.php.coverage.reportPaths=clover.xml \
        -Dsonar.php.tests.reportPath=junit.xml \
        -Dsonar.exclusions=siteSAE2A/vendor/**,Blazor/**/bin/**,Blazor/**/obj/** \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN

  allow_failure: true
  only:
    - main
# ----------------------
# INCLUDE & DOCKER JOBS (Inchangés)
# ----------------------
include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file: ['build/.docker-build.yml', 'deploy/.docker-deploy.yml']
    token: $CI_PERSONAL_TOKEN

push-dotnet-image:
  extends: .build-and-push-docker-image
  stage: 📦push
  variables:
    DOCKERFILE_RELATIVE_PATH: Blazor/BlazorAdminRentPark/Dockerfile
    DOCKERFILE_CONTEXT_PATH: Blazor/BlazorAdminRentPark
    DESTINATION_REGISTRY_IMAGE_NAME: codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark
    DESTINATION_REGISTRY_IMAGE_VERSION: latest
  dependencies:
    - build-blazor
  rules:
    - when: on_success

deploy-my-pod:
  extends: .deploy-image
  stage: 🚀deploy
  variables:
    CONTAINER_NAME: blazor-admin-pod
    CONTAINER_IMAGE_PATH: codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark:latest
    NAMESPACE_NAME: altixier1
  dependencies:
    - push-dotnet-image
  rules:
    - when: manual