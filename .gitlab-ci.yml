stages:
  - build
  - test
  - scan

# ----------------------
# 1. BUILD
# ----------------------
build-php:
  stage: build
  image: php:8.3-cli
  script:
    - apt-get update && apt-get install -y unzip git curl
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
    - cd siteSAE2A
    - composer install --no-interaction --prefer-dist
  artifacts:
    paths:
      - siteSAE2A/vendor/
    expire_in: 1 hour

# ----------------------
# 2. TESTS (C'est ici qu'on crée les fichiers pour Sonar)
# ----------------------
php-tests:
  stage: test
  image: php:8.3-cli
  dependencies:
    - build-php
  before_script:
    - apt-get update && apt-get install -y libxml2-dev
    - pecl install xdebug && docker-php-ext-enable xdebug
  script:
    - cd siteSAE2A
    # On génère les rapports DIRECTEMENT à la racine du projet GitLab (../)
    - php -d xdebug.mode=coverage vendor/bin/phpunit \
        --coverage-text \
        --coverage-clover=../clover.xml \
        --coverage-cobertura=../coverage.xml \
        --log-junit=../junit.xml
  coverage: '/^\s*Lines:\s*\d+(?:\.\d+)?\%/'
  artifacts:
    when: always
    paths:
      - clover.xml
      - coverage.xml
      - junit.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ----------------------
# 3. SONAR (Configuration adaptée à ton dossier siteSAE2A)
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  dependencies:
    - php-tests
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    # On vérifie si les fichiers existent avant de lancer le scan (pour le debug)
    - ls -l clover.xml junit.xml 
    - sonar-scanner \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
        -Dsonar.sources=siteSAE2A \
        -Dsonar.tests=siteSAE2A/tests \
        -Dsonar.php.coverage.reportPaths=clover.xml \
        -Dsonar.php.tests.reportPath=junit.xml \
        -Dsonar.exclusions=siteSAE2A/vendor/** \
        -X
  allow_failure: true
  only:
    - main