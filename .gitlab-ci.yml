stages:
  - build
  - scan
  - 📦push
  - deploy

# ----------------------
# BUILD PHP
# ----------------------
build-php:
  stage: build
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y unzip git curl
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
  script:
    - echo "Installing PHP dependencies..."
    - cd siteSAE2A
    - composer install --no-interaction --prefer-dist
    - composer dump-autoload
    - echo "PHP build done"
  artifacts:
    paths:
      - siteSAE2A/vendor/

# ----------------------
# BUILD BLAZOR
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd Blazor/BlazorAdminRentPark
    - echo "Restoring .NET packages..."
    - dotnet restore
    - echo "Building Blazor app..."
    - dotnet build -c Release
  artifacts:
    paths:
      - Blazor/BlazorAdminRentPark/bin/Release/

# ----------------------
# SONAR SCANNER
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  script:
    - echo "Running SonarScanner..."
    - sonar-scanner -X
  allow_failure: true
  dependencies:
    - build-php
    - build-blazor
  only:
    - main

# ----------------------
# DOCKER BUILD & PUSH (BLAZOR)
# ----------------------
include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file:
      - 'build/.docker-build.yml'

push-blazor-image:
  extends: .build-and-push-docker-image
  stage: 📦push
  variables:
    # Dockerfile et contexte
    DOCKERFILE_RELATIVE_PATH: Blazor/BlazorAdminRentPark/Dockerfile
    DOCKERFILE_CONTEXT_PATH: Blazor/BlazorAdminRentPark

    # Registry GitLab : utilise ton username comme namespace si tu n'as pas de groupe
    DESTINATION_REGISTRY_IMAGE_NAME: registry.gitlab.com/qumiotto/rentpark/blazor-admin
    DESTINATION_REGISTRY_IMAGE_VERSION: latest

    # Auth GitLab CI
    DESTINATION_REGISTRY_USER: $CI_REGISTRY_USER
    DESTINATION_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual


# ----------------------
# DEPLOY (placeholder)
# ----------------------
deploy:
  stage: deploy
  image: ubuntu:latest
  script:
    - echo "Deploying PHP backend..."
    - echo "Deploying Blazor frontend..."
    - echo "Deployment finished"
  environment: production
  dependencies:
    - build-php
    - build-blazor
  rules:
    - when: manual




