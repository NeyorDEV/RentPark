stages:
  - build
  - scan
  - deploy

# ----------------------
# BUILD PHP (SiteSae2A)
# ----------------------
build-php:
  stage: build
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y unzip git curl
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
  script:
    - echo "Installing PHP dependencies..."
    - cd siteSAE2A
    - composer install --no-interaction --prefer-dist
    - composer dump-autoload
    - echo "PHP build done"
  artifacts:
    paths:
      - siteSAE2A/vendor/


# ----------------------
# BUILD Blazor (Blazor/blazorAdminRentPark)
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd Blazor/BlazorAdminRentPark
    - echo "Restoring .NET packages..."
    - dotnet restore BlazorAdminRentPark.csproj
    - echo "Building Blazor app..."
    - dotnet build BlazorAdminRentPark.csproj -c Release
  artifacts:
    paths:
      - Blazor/BlazorAdminRentPark/bin/Release/

# ----------------------
# SONAR SCANNER
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  script:
    - echo "Running SonarScanner..."
    - sonar-scanner -X
  allow_failure: true
  dependencies:
    - build-php
    - build-blazor
  only:
    - main

# ----------------------
# DEPLOY
# ----------------------
deploy:
  stage: deploy
  image: ubuntu:latest
  script:
    - echo "Deploying PHP backend..."
    - echo "Deploying Blazor frontend..."
    - echo "Deployment finished"
  environment: production
  dependencies:
    - build-php
    - build-blazor


