stages:
  - build
  - scan
  - deploy

# ----------------------
# BUILD PHP
# ----------------------
build-php:
  stage: build
  image: php:8.2-cli
  script:
    - echo "Installing PHP dependencies..."
    - composer install
    - echo "PHP build done"
  artifacts:
    paths:
      - vendor/

# ----------------------
# BUILD Blazor
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - echo "Restoring .NET packages..."
    - dotnet restore ./BlazorApp/BlazorApp.csproj
    - echo "Building Blazor app..."
    - dotnet build ./BlazorApp/BlazorApp.csproj -c Release
  artifacts:
    paths:
      - BlazorApp/bin/Release/

# ----------------------
# SONAR SCANNER
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  script:
    - echo "Running SonarScanner..."
    - sonar-scanner -X
  allow_failure: true    # ← Quality Gate échoue = orange, pipeline continue
  dependencies:
    - build-php
    - build-blazor
  only:
    - main

# ----------------------
# DEPLOY
# ----------------------
deploy:
  stage: deploy
  image: ubuntu:latest
  script:
    - echo "Deploying PHP backend..."
    - echo "Deploying Blazor frontend..."
    - echo "Deployment finished"
  environment: production
  dependencies:
    - build-php
    - build-blazor


