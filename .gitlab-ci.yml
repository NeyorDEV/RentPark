# ----------------------
# STAGES
# ----------------------
stages:
  - build
  - scan
  - push
  - deploy

# ----------------------
# BUILD PHP
# ----------------------
build-php:
  stage: build
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y unzip git curl
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
  script:
    - echo "Installing PHP dependencies..."
    - cd siteSAE2A
    - composer install --no-interaction --prefer-dist
    - composer dump-autoload
    - echo "PHP build done"
  artifacts:
    paths:
      - siteSAE2A/vendor/

# ----------------------
# BUILD BLAZOR
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd Blazor/BlazorAdminRentPark
    - echo "Restoring .NET packages..."
    - dotnet restore
    - echo "Building Blazor app..."
    - dotnet build -c Release
  artifacts:
    paths:
      - Blazor/BlazorAdminRentPark/bin/Release/

# ----------------------
# SONAR SCANNER
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  script:
    - echo "Running SonarScanner..."
    - sonar-scanner -X
  allow_failure: true
  dependencies:
    - build-php
    - build-blazor
  only:
    - main

# ----------------------
# BUILD & PUSH DOCKER IMAGE (BLAZOR)
# ----------------------
push-blazor-image:
  stage: push
  image: gcr.io/kaniko-project/executor:latest
  script:
    - echo "{\"auths\":{\"codefirst.iut.uca.fr\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor \
        --context Blazor/BlazorAdminRentPark \
        --dockerfile Blazor/BlazorAdminRentPark/Dockerfile \
        --destination codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark:latest
  allow_failure: true
  rules:
    - when: manual
  dependencies:
    - build-blazor

# ----------------------
# DEPLOY
# ----------------------
deploy-my-pod:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Déploiement du pod Blazor..."
    - docker login codefirst.iut.uca.fr -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - docker pull codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark:latest
    - docker stop blazor-admin-pod || true
    - docker rm blazor-admin-pod || true
    - docker run -d --name blazor-admin-pod -e ENV_PRODUCTION=true codefirst.iut.uca.fr/qumiotto/sae_2a_rentpark:latest
  environment: production
  allow_failure: true
  rules:
    - when: manual
  dependencies:
    - push-blazor-image





