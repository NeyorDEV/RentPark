stages:
  - build
  - scan
  - 📦push
  - deploy

# ----------------------
# BUILD PHP
# ----------------------
build-php:
  stage: build
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y unzip git curl
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
  script:
    - cd siteSAE2A
    - composer install --no-interaction --prefer-dist
    - composer dump-autoload
  artifacts:
    paths:
      - siteSAE2A/vendor/

# ----------------------
# BUILD BLAZOR
# ----------------------
build-blazor:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - cd Blazor/BlazorAdminRentPark
    - dotnet restore
    - dotnet build -c Release
  artifacts:
    paths:
      - Blazor/BlazorAdminRentPark/bin/Release/

# ----------------------
# SONAR
# ----------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -X
  allow_failure: true
  dependencies:
    - build-php
    - build-blazor
  only:
    - main

# ----------------------
# DOCKER BUILD & PUSH
# ----------------------
include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file:
      - 'build/.docker-build.yml'

push-blazor-image:
  extends: .build-and-push-docker-image
  stage: 📦push
  variables:
    DOCKERFILE_RELATIVE_PATH: Blazor/BlazorAdminRentPark/Dockerfile
    DOCKERFILE_CONTEXT_PATH: Blazor/BlazorAdminRentPark
    DESTINATION_REGISTRY_IMAGE_NAME: registry.gitlab.com/IUT_INF63/rentpark/blazor-admin
    DESTINATION_REGISTRY_IMAGE_VERSION: latest
  rules:
    - when: manual

# ----------------------
# DEPLOY (placeholder)
# ----------------------
deploy:
  stage: deploy
  image: ubuntu:latest
  script:
    - echo "Déploiement à remplacer par deploy-image"
  rules:
    - when: manual



